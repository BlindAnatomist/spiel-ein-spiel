<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123c32"><title>Euchre · Spiel ein Spiel</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main><header><p class="eyebrow">Spiel ein Spiel</p><h1>Euchre</h1><p>You and Val. First to ten.</p></header><form id="setup"><div id="top-score" aria-hidden="true"><span>You + Val <b>0</b></span><span>Opponents <b>0</b></span></div><label for="difficulty">Opponent difficulty</label><select id="difficulty"><option value="casual">Casual</option><option value="strong" selected>Strong</option><option value="expert">Expert</option></select><button type="submit" aria-label="New Game" class="icon-button"><span class="sr-only">New Game</span><span class="new-icon" aria-hidden="true"></span></button></form><p class="hint">Stick the dealer. Maker may go alone. New Game replaces the current game.</p><button id="sound-cues" type="button" aria-pressed="false" aria-label="Sound Cues" class="icon-button"><span class="sr-only">Sound Cues</span><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32"><path d="M6 12h5l7-6v20l-7-6H6z"/><path class="sound-wave" d="M23 10q8 6 0 12"/></svg></button><div id="game" hidden></div><p id="announcements" role="status" aria-live="polite" aria-atomic="true"></p><noscript>Enable JavaScript to play Euchre.</noscript></main></body></html>
