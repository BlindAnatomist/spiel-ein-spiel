name: Generate package lock
on:
  push:
    branches:
      - fix/server-backed-performance-analysis
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - name: Emit package lock
        run: |
          echo LOCK_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCK_END
