<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123c32"><title>Euchre · Spiel ein Spiel</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main><header><p class="eyebrow">Spiel ein Spiel</p><h1>Euchre</h1><p>You and Val. First to ten.</p></header><form id="setup"><label for="difficulty">Opponent difficulty</label><select id="difficulty"><option value="casual">Casual</option><option value="strong" selected>Strong</option><option value="expert">Expert</option><option value="mixed">Mixed opponents</option></select><button type="submit">New Game</button></form><p class="hint">Stick the dealer. Maker may go alone. Mixed opponents uses two different difficulty levels. New Game replaces the current game.</p><button id="sound-cues" type="button" aria-pressed="false">Sound Cues</button><button id="performance-summary" type="button">Performance summary</button><button id="performance-recovery" type="button">Performance recovery code</button><p id="performance-output" hidden tabindex="-1"></p><div id="game" hidden></div><p id="announcements" role="status" aria-live="polite" aria-atomic="true"></p><form name="euchre-performance-ledger" method="POST" data-netlify="true" hidden><input type="hidden" name="profile_id"><input type="hidden" name="game_id"><input type="hidden" name="completed_at"><input type="hidden" name="payload"></form><noscript>Enable JavaScript to play Euchre.</noscript></main></body></html>
