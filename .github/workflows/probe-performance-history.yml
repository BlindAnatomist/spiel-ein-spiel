name: Probe performance history endpoint
on:
  push:
    branches:
      - fix/server-backed-performance-analysis
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for preview function
        run: |
          url='https://deploy-preview-11--spiel-ein-spiel-euchre-preview.netlify.app/api/performance-history?profile=EUC-test-history-1234567890'
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/history.json -w '%{http_code}' "$url" || true)
            if [ "$code" = 200 ]; then cat /tmp/history.json; exit 0; fi
            sleep 2
          done
          cat /tmp/history.json || true
          exit 1
      - name: Write and read one compact test game
        run: |
          base='https://deploy-preview-11--spiel-ein-spiel-euchre-preview.netlify.app/api/performance-history'
          cat > /tmp/game.json <<'JSON'
          {"profileId":"EUC-test-history-1234567890","game":{"schemaVersion":2,"datasetEpoch":1,"buildCommit":"probe","rulesVersion":"euchre-standard-v1","id":"probe-game-1","completedAt":"2026-09-28T05:40:00.000Z","humanTracking":"owner","difficulty":"strong","startingDealer":0,"opponents":[],"winner":0,"score":[10,5],"hands":[]}}
          JSON
          curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/game.json "$base"
          curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/game.json "$base"
          curl -fsS "$base?profile=EUC-test-history-1234567890" > /tmp/result.json
          node -e "const x=require('/tmp/result.json'); if(x.version!==2||x.games.length!==1||x.games[0].id!=='probe-game-1') { console.error(x); process.exit(1) } console.log(JSON.stringify(x))"
