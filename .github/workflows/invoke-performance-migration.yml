name: Invoke private performance migration
on:
  push:
    branches:
      - fix/server-backed-performance-analysis
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Seed canonical compact history
        run: |
          url='https://deploy-preview-11--spiel-ein-spiel-euchre-preview.netlify.app/api/migrate-performance-history-20260928'
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/migrate.json -w '%{http_code}' "$url" || true)
            if [ "$code" = 200 ]; then
              cat /tmp/migrate.json
              node -e "const x=require('/tmp/migrate.json'); if(!x.ok||x.migrated!==11||x.stored!==11){console.error(x);process.exit(1)}"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/migrate.json || true
          exit 1
